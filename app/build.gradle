plugins {
    id 'com.android.application'
}


android {
    namespace 'com.tuapp.stockapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.tuapp.stockapp"
        minSdk 24
        targetSdk 34
        versionCode 6         // <-- Cambiado de 5 a 6
        versionName "1.3.0"    // <-- Cambiado de 1.0.0 a 1.2.0
    }
    
    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8' // O la versión correspondiente a tu versión de Kotlin
    }

    // 1. Definimos la clave de firma
    signingConfigs {
        release {
            storeFile file(MYAPP_RELEASE_STORE_FILE)
            storePassword MYAPP_RELEASE_STORE_PASSWORD
            keyAlias MYAPP_RELEASE_KEY_ALIAS
            keyPassword MYAPP_RELEASE_KEY_PASSWORD
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 2. Le decimos a la build de release que use la firma que definimos arriba
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    dependencies {
    // Jetpack Compose BOM (Mantiene todas las librerías de UI alineadas)
        def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
        implementation composeBom
        androidTestImplementation composeBom
    
        // Librerías principales de UI
        implementation 'androidx.compose.ui:ui'
        implementation 'androidx.compose.ui:ui-graphics'
        implementation 'androidx.compose.ui:ui-tooling-preview'
        implementation 'androidx.compose.material3:material3' // Componentes Material 3
        implementation 'androidx.activity:activity-compose:1.8.2'
        
        // Integración con ViewPager/Navigation si es necesario
        implementation 'androidx.navigation:navigation-compose:2.7.7'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.cardview:cardview:1.0.0'
}
